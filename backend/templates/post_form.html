{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center mb-0">分享账号密码</h2>
            </div>
            <div class="card-body">
                <form method="POST" onsubmit="return validateForm()">
                    <input type="hidden" name="platform" value="一同看">
                    <div class="mb-3">
                        <label for="account_name" class="form-label">账号</label>
                        <input type="text" class="form-control" id="account_name" name="account_name" required>
                        <div class="invalid-feedback">账号已存在，请使用其他账号</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="text" class="form-control" id="password" name="password" required 
                               minlength="4" pattern=".{4,}"
                               oninvalid="this.setCustomValidity('密码长度不能少于4位')"
                               oninput="this.setCustomValidity('')">
                        <div class="form-text">密码长度不能少于4位</div>
                    </div>
                    <div class="mb-3">
                        <label for="expire_date" class="form-label">会员到期时间</label>
                        <input type="datetime-local" class="form-control" id="expire_date" name="expire_date" required>
                        <div class="form-text">账号会在会员到期时自动删除</div>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">备注说明</label>
                        <textarea class="form-control" id="content" name="content" rows="2" 
                                  placeholder="可以填写账号的其他说明"></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">分享</button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// 设置默认到期时间为24小时后
var expire_date = document.getElementById('expire_date');
var tomorrow = new Date();
tomorrow.setDate(tomorrow.getDate() + 1);
expire_date.value = tomorrow.toISOString().slice(0, 16);

// 检查账号是否存在
document.getElementById('account_name').addEventListener('change', function() {
    var accountName = this.value;
    if (accountName) {
        fetch('/check_account_exists/' + encodeURIComponent(accountName))
            .then(response => response.json())
            .then(data => {
                if (data.exists) {
                    this.classList.add('is-invalid');
                } else {
                    this.classList.remove('is-invalid');
                }
            });
    }
});

// 表单提交验证
function validateForm() {
    var accountInput = document.getElementById('account_name');
    var passwordInput = document.getElementById('password');
    
    // 检查密码长度
    if (passwordInput.value.length < 4) {
        alert('密码长度不能少于4位');
        return false;
    }
    
    // 检查账号是否有效
    if (accountInput.classList.contains('is-invalid')) {
        alert('账号已存在，请使用其他账号');
        return false;
    }
    
    return true;
}
</script>
{% endblock %}
